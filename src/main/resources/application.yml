spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sri}
    username: ${DB_USER:sri}
    password: ${DB_PASSWORD:sri}
  servlet:
    multipart:
      max-file-size: 1MB
  mvc:
    problemdetails:
      enabled: true
  # SMTP para enviar RIDE y XML a los clientes. Sin SMTP_HOST el envío queda desactivado.
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 20000
      mail.smtp.writetimeout: 20000

app:
  sri-ambiente: ${SRI_AMBIENTE:1}
  jwt-secret: ${JWT_SECRET}
  encryption-key: ${ENCRYPTION_KEY}
  superadmin-email: ${SUPERADMIN_EMAIL:}
  superadmin-password: ${SUPERADMIN_PASSWORD:}
  correo:
    smtp-host: ${SMTP_HOST:}
    remitente: ${SMTP_FROM:}
  alertas:
    emails: ${ALERTAS_EMAIL:}
  metrics-token: ${METRICS_TOKEN:}

springdoc:
  api-docs:
    path: /api-docs
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /api
    persist-authorization: true
    operations-sorter: alpha
    tags-sorter: alpha

server:
  port: ${PORT:8080}

# Health check en /status (DB y disco), sin exponer detalles internos.
management:
  # El SMTP no decide si la API está viva: sin esto /status quedaría DOWN cuando no hay correo configurado.
  health:
    mail:
      enabled: false
  endpoints:
    web:
      base-path: /
      path-mapping:
        health: status
      exposure:
        include: health, prometheus
